<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NetOps — AI Automation</title>

  <style>
    :root{
      /* Light theme */
      --bg0: #0b0f19;
      --bg1: #0f172a;
      --panel: rgba(255,255,255,.08);
      --panel2: rgba(255,255,255,.06);
      --stroke: rgba(255,255,255,.10);

      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.65);

      --userBubble: linear-gradient(135deg, #2563eb, #0ea5e9);
      --assistantBubble: rgba(255,255,255,.10);

      --shadow: 0 20px 60px rgba(0,0,0,.45);
      --shadow2: 0 8px 24px rgba(0,0,0,.25);

      --radius: 18px;
      --radius2: 14px;

      --ok: #22c55e;
      --warn: #f59e0b;
      --bad: #ef4444;

      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      font-family: var(--sans);
      color: var(--text);
      background:
        radial-gradient(1200px 700px at 20% -10%, rgba(56,189,248,.35), transparent 55%),
        radial-gradient(900px 600px at 85% 15%, rgba(99,102,241,.35), transparent 60%),
        radial-gradient(900px 600px at 50% 110%, rgba(34,197,94,.20), transparent 55%),
        linear-gradient(180deg, var(--bg0), var(--bg1));
      display: grid;
      place-items: center;
      padding: 18px;
    }

    .app{
      width: min(980px, 100%);
      height: min(86vh, 820px);
      display: grid;
      grid-template-rows: auto 1fr auto;
      border: 1px solid var(--stroke);
      background: rgba(255,255,255,.04);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    /* Top bar */
    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(0,0,0,.20);
      border-bottom: 1px solid var(--stroke);
    }

    .brand{
      display:flex;
      align-items:center;
      gap: 10px;
      min-width: 0;
    }

    .logo{
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(56,189,248,.9), rgba(99,102,241,.9));
      box-shadow: 0 10px 25px rgba(59,130,246,.25);
      display:grid;
      place-items:center;
      font-weight: 800;
      letter-spacing: .2px;
    }

    .brand h1{
      font-size: 14.5px;
      line-height: 1.1;
      margin: 0;
      font-weight: 700;
      letter-spacing: .2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .brand .sub{
      font-size: 12px;
      color: var(--muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status{
      display:flex;
      align-items:center;
      gap: 8px;
      color: var(--muted);
      font-size: 12px;
      user-select:none;
    }

    .dot{
      width: 9px; height: 9px;
      border-radius: 999px;
      background: var(--warn);
      box-shadow: 0 0 0 4px rgba(245,158,11,.15);
    }

    /* Chat */
    .chat{
      padding: 16px;
      overflow: hidden;
      display:flex;
      flex-direction: column;
      gap: 12px;
    }

    .messages{
      flex: 1;
      overflow-y: auto;
      padding: 2px 2px 10px 2px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 10px; }
    .messages::-webkit-scrollbar-thumb {
      background: rgba(255,255,255,.10);
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,0);
      background-clip: padding-box;
    }

    /* Message row */
    .row{
      display:flex;
      gap: 10px;
      padding: 10px 6px;
      align-items:flex-end;
    }

    .row.user{
      justify-content: flex-end;
    }

    .avatar{
      width: 34px;
      height: 34px;
      border-radius: 12px;
      flex: 0 0 auto;
      display:grid;
      place-items:center;
      font-weight: 800;
      font-size: 12px;
      color: rgba(255,255,255,.92);
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.07);
      box-shadow: var(--shadow2);
    }

    .row.user .avatar{
      background: rgba(37,99,235,.22);
      border-color: rgba(37,99,235,.35);
    }

    .bubble{
      max-width: min(760px, 78%);
      border-radius: var(--radius);
      padding: 10px 12px;
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 10px 22px rgba(0,0,0,.18);
      position: relative;
      overflow: hidden;
    }

    .row.assistant .bubble{
      background: var(--assistantBubble);
      border-bottom-left-radius: 10px;
    }

    .row.user .bubble{
      background: var(--userBubble);
      border-color: rgba(255,255,255,.16);
      border-bottom-right-radius: 10px;
    }

    .bubble .meta{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap: 8px;
      margin-bottom: 6px;
      color: rgba(255,255,255,.72);
      font-size: 11.5px;
    }

    .row.user .bubble .meta{
      color: rgba(255,255,255,.78);
    }

    .bubble .content{
      font-size: 14px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    /* Simple safe “markdown-ish” blocks (code fences) */
    .content p{ margin: 0 0 10px 0; }
    .content p:last-child{ margin-bottom: 0; }

    pre{
      margin: 10px 0 0 0;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(0,0,0,.30);
      border: 1px solid rgba(255,255,255,.10);
      font-family: var(--mono);
      font-size: 12.8px;
      overflow-x: auto;
    }

    code{
      font-family: var(--mono);
    }

    /* Composer */
    .composer{
      padding: 14px 16px;
      border-top: 1px solid var(--stroke);
      background: rgba(0,0,0,.18);
      display:flex;
      flex-direction: column;
      gap: 10px;
    }

    .chips{
      display:flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip{
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: rgba(255,255,255,.86);
      border-radius: 999px;
      padding: 7px 10px;
      font-size: 12.5px;
      cursor:pointer;
      transition: transform .08s ease, background .15s ease, border-color .15s ease;
      user-select:none;
    }
    .chip:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.10);
      border-color: rgba(255,255,255,.18);
    }

    .composeRow{
      display:flex;
      gap: 10px;
      align-items:flex-end;
    }

    textarea{
      flex: 1;
      resize: none;
      min-height: 46px;
      max-height: 160px;
      padding: 12px 12px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.06);
      color: var(--text);
      font-size: 14px;
      outline: none;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06);
    }

    textarea::placeholder{
      color: rgba(255,255,255,.45);
    }

    .send{
      width: 46px;
      height: 46px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(255,255,255,.10);
      color: rgba(255,255,255,.92);
      cursor: pointer;
      display:grid;
      place-items:center;
      transition: transform .08s ease, background .15s ease, border-color .15s ease, opacity .2s ease;
      box-shadow: 0 12px 24px rgba(0,0,0,.18);
    }
    .send:hover{
      transform: translateY(-1px);
      background: rgba(255,255,255,.14);
      border-color: rgba(255,255,255,.22);
    }
    .send:disabled{
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    .hint{
      font-size: 12px;
      color: var(--muted);
      display:flex;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .toast{
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.55);
      border: 1px solid rgba(255,255,255,.15);
      color: rgba(255,255,255,.92);
      padding: 10px 12px;
      border-radius: 12px;
      box-shadow: var(--shadow2);
      font-size: 13px;
      display:none;
      max-width: min(560px, 92vw);
    }

    /* Typing dots */
    .typing{
      display:inline-flex;
      gap: 6px;
      align-items:center;
      padding: 3px 0;
    }
    .typing span{
      width: 7px; height: 7px;
      border-radius: 999px;
      background: rgba(255,255,255,.75);
      display:inline-block;
      animation: bounce 1s infinite ease-in-out;
    }
    .typing span:nth-child(2){ animation-delay: .12s; }
    .typing span:nth-child(3){ animation-delay: .24s; }
    @keyframes bounce{
      0%, 80%, 100%{ transform: translateY(0); opacity: .6; }
      40%{ transform: translateY(-4px); opacity: 1; }
    }

    @media (max-width: 560px){
      .bubble{ max-width: 88%; }
      .row{ padding: 10px 2px; }
      .chat{ padding: 12px; }
    }
  </style>
</head>

<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="logo">N</div>
        <div style="min-width:0">
          <h1>NetOps</h1>
          <div class="sub">AI-powered network automation assistant</div>
        </div>
      </div>

      <div class="status" title="Backend status">
        <span id="statusDot" class="dot"></span>
        <span id="statusText">Ready</span>
      </div>
    </header>

    <main class="chat">
      <div id="messages" class="messages"></div>
    </main>

    <section class="composer">
      <div class="chips" aria-label="Quick actions">
        <button class="chip" data-prompt="List available scripts">List scripts</button>
        <button class="chip" data-prompt="Show help (how to run a script)">Help</button>
        <button class="chip" data-prompt="Run inventoryValidation for devices 10.0.0.1,10.0.0.2 (example)">Run example</button>
        <button class="chip" data-prompt="What inputs does dot1xConfig need?">Ask about inputs</button>
      </div>

      <div class="composeRow">
        <textarea id="msgInput" placeholder="Message NetOps… (Enter to send • Shift+Enter for a new line)"></textarea>
        <button id="sendBtn" class="send" aria-label="Send message" title="Send">
          <!-- simple paper-plane icon -->
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M3 11.5L21 3l-8.5 18-2.7-7.2L3 11.5Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            <path d="M21 3l-11.2 10.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </button>
      </div>

      <div class="hint">
        <span>Tip: try “list scripts” or “run dot1xConfig …”</span>
        <span id="latencyHint"></span>
      </div>
    </section>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    console.log("[INIT] NetOps UI loading…");

    // ✅ Change backend here if needed
    const BACKEND_URL = "http://127.0.0.1:8000/chat";

    const messagesEl = document.getElementById("messages");
    const inputEl = document.getElementById("msgInput");
    const sendBtn = document.getElementById("sendBtn");
    const statusDot = document.getElementById("statusDot");
    const statusText = document.getElementById("statusText");
    const latencyHint = document.getElementById("latencyHint");
    const toastEl = document.getElementById("toast");

    let isSending = false;

    function setStatus(state, text){
      // state: "ok" | "warn" | "bad"
      const colors = { ok: "var(--ok)", warn: "var(--warn)", bad: "var(--bad)" };
      statusDot.style.background = colors[state] || "var(--warn)";
      statusDot.style.boxShadow =
        state === "ok"  ? "0 0 0 4px rgba(34,197,94,.15)" :
        state === "bad" ? "0 0 0 4px rgba(239,68,68,.15)" :
                          "0 0 0 4px rgba(245,158,11,.15)";
      statusText.textContent = text;
    }

    function toast(msg){
      toastEl.textContent = msg;
      toastEl.style.display = "block";
      clearTimeout(toastEl._t);
      toastEl._t = setTimeout(() => toastEl.style.display = "none", 2600);
    }

    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    // Safe rendering with optional ``` code fences (no innerHTML injection)
    function renderContent(container, text){
      const parts = text.split("```");
      // Even index = normal text, odd index = code block
      parts.forEach((part, idx) => {
        if (!part) return;
        if (idx % 2 === 0){
          // normal text: split paragraphs a bit for readability
          const p = document.createElement("p");
          p.textContent = part.trim();
          if (p.textContent) container.appendChild(p);
        } else {
          const pre = document.createElement("pre");
          const code = document.createElement("code");
          code.textContent = part.replace(/^\n+|\n+$/g, "");
          pre.appendChild(code);
          container.appendChild(pre);
        }
      });
    }

    function addMessage({ role, text, label }){
      const row = document.createElement("div");
      row.className = "row " + (role === "user" ? "user" : "assistant");

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = role === "user" ? "You" : "N";

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const meta = document.createElement("div");
      meta.className = "meta";
      const who = document.createElement("span");
      who.textContent = label || (role === "user" ? "You" : "NetOps");
      const time = document.createElement("span");
      time.textContent = nowTime();
      meta.appendChild(who);
      meta.appendChild(time);

      const content = document.createElement("div");
      content.className = "content";

      renderContent(content, text);

      bubble.appendChild(meta);
      bubble.appendChild(content);

      if (role === "user"){
        row.appendChild(bubble);
        row.appendChild(avatar);
      } else {
        row.appendChild(avatar);
        row.appendChild(bubble);
      }

      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;

      return { row, bubble, content };
    }

    function addTyping(){
      const { row, bubble, content } = addMessage({
        role: "assistant",
        label: "NetOps",
        text: ""
      });

      const t = document.createElement("div");
      t.className = "typing";
      t.innerHTML = "<span></span><span></span><span></span>";
      content.appendChild(t);

      return { row, bubble };
    }

    function setSending(v){
      isSending = v;
      sendBtn.disabled = v || !inputEl.value.trim();
      inputEl.disabled = v;
      if (v) setStatus("warn", "Thinking…");
      else setStatus("ok", "Ready");
    }

    function autoGrow(){
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + "px";
      sendBtn.disabled = isSending || !inputEl.value.trim();
    }

    async function sendMessage(textOverride){
      const text = (textOverride ?? inputEl.value).trim();
      if (!text || isSending) return;

      addMessage({ role: "user", text });
      inputEl.value = "";
      autoGrow();

      setSending(true);
      const typing = addTyping();

      const payload = { message: text };
      const start = performance.now();

      try{
        const res = await fetch(BACKEND_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });

        const ms = Math.round(performance.now() - start);
        latencyHint.textContent = `Last response: ${ms}ms`;

        if (!res.ok){
          throw new Error(`HTTP ${res.status} ${res.statusText}`);
        }

        let data;
        try{
          data = await res.json();
        } catch (e){
          throw new Error("Backend returned invalid JSON.");
        }

        // Remove typing bubble
        typing.row.remove();

        if (data.assistant_message){
          addMessage({ role: "assistant", text: data.assistant_message, label: "NetOps" });
          setStatus("ok", "Ready");
        } else if (data.error){
          addMessage({ role: "assistant", text: "Error: " + data.error, label: "NetOps" });
          setStatus("bad", "Backend error");
          toast("Backend error received.");
        } else {
          addMessage({ role: "assistant", text: "Unexpected response from backend.", label: "NetOps" });
          setStatus("warn", "Unexpected response");
          toast("Unexpected backend response.");
        }

        // Optional debug logs (kept, but cleaner)
        if (data.script_executed || data.script_result){
          console.log("[DEBUG] script result:", {
            script_executed: data.script_executed,
            script_result: data.script_result
          });
        }

      } catch (err){
        console.error("[sendMessage] Failed:", err);
        typing.row.remove();
        addMessage({
          role: "assistant",
          label: "NetOps",
          text:
            "I couldn't reach the backend.\n\n" +
            "• Make sure the API is running on http://127.0.0.1:8000\n" +
            "• If you opened this HTML from a file (file://), your browser may block requests (CORS).\n" +
            "  Try serving the HTML with a local server (e.g. python -m http.server).\n\n" +
            "Error: " + String(err)
        });
        setStatus("bad", "Offline");
        toast("Cannot reach backend (offline).");
      } finally {
        setSending(false);
        inputEl.focus();
      }
    }

    // Quick action chips
    document.querySelectorAll(".chip").forEach(btn => {
      btn.addEventListener("click", () => {
        const prompt = btn.getAttribute("data-prompt") || "";
        inputEl.value = prompt;
        autoGrow();
        inputEl.focus();
      });
    });

    // Send button click
    sendBtn.addEventListener("click", () => sendMessage());

    // Enter to send, Shift+Enter for newline (ChatGPT behavior)
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey){
        e.preventDefault();
        sendMessage();
      }
    });

    inputEl.addEventListener("input", autoGrow);

    // Welcome message
    window.addEventListener("load", () => {
      setStatus("ok", "Ready");
      addMessage({
        role: "assistant",
        label: "NetOps",
        text:
          "Hi! I’m NetOps.\n\n" +
          "Try things like:\n" +
          "• List available scripts\n" +
          "• What inputs does dot1xConfig need?\n" +
          "• Run inventoryValidation for devices 10.0.0.1,10.0.0.2\n\n" +
          "Tip: Use Shift+Enter for a new line."
      });
      inputEl.focus();
      autoGrow();
      console.log("[INIT] UI ready.");
    });
  </script>
</body>
</html>
